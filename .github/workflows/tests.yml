name: Daily Digest Python Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no APIs/secrets needed)
        run: python -m unittest discover -s tests -v
